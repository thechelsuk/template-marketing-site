<!doctype html>
<html lang="en-GB">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Replace APP_STORE_ID, the app name, the description and the host. -->
    <meta name="apple-itunes-app" content="app-id=APP_STORE_ID">
    <meta name="description" content="One sentence about the app.">
    <meta name="author" content="thechelsuk">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://example.thechels.uk/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="App name">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://example.thechels.uk/">
    <meta property="og:title" content="App name">
    <meta property="og:description" content="One sentence about the app.">
    <title>App name</title>
    <link rel="stylesheet" href="styles.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "App name",
        "operatingSystem": "iOS",
        "url": "https://example.thechels.uk/",
        "downloadUrl": "https://apps.apple.com/gb/app/APP_SLUG/idAPP_STORE_ID",
        "inLanguage": "en-GB",
        "author": {
          "@type": "Person",
          "name": "Mat Benfield",
          "alternateName": "thechelsuk",
          "url": "https://thechels.uk/"
        }
      }
    </script>
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="#top">App name</a>
      <nav aria-label="Main navigation">
        <a href="#features">Features</a>
        <a href="https://thechels.uk/app/privacy">Privacy</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">App name</h1>
        <p>One sentence about what the app does and who it's for.</p>
        <a class="app-store-button" href="https://apps.apple.com/gb/app/APP_SLUG/idAPP_STORE_ID">
          <img src="images/app-store-badge.svg" alt="Download on the App Store" width="120" height="40">
        </a>
      </section>

      <section id="features" aria-labelledby="features-title">
        <h2 id="features-title">Features</h2>
        <ul>
          <li>First feature</li>
          <li>Second feature</li>
          <li>Third feature</li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>Made with <span aria-label="love">♥</span> by <a href="https://thechels.uk/">thechelsuk</a></p>
    </footer>
  </body>

</html>
