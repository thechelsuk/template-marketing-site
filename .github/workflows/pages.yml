# Checks the static site's files and deploys them to GitHub Pages as they
# are (no build). Add any new file or folder to both steps below.
#
# Requires Settings -> Pages -> Source: "GitHub Actions". The template repo
# itself only checks its files; it doesn't deploy.

name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Verify static site files
        run: |
          test -s index.html
          test -s styles.css
          test -s CNAME
          test -s robots.txt
          test -s sitemap.xml
          test -s llms.txt
          test -s .well-known/security.txt
          test -s images/app-store-badge.svg

      - name: Assemble Pages site
        if: github.event_name != 'pull_request' && !github.event.repository.is_template
        run: |
          mkdir -p _site
          cp .nojekyll CNAME index.html styles.css robots.txt sitemap.xml llms.txt _site/
          cp -R images .well-known _site/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && !github.event.repository.is_template
        uses: actions/configure-pages@v6

      - name: Upload static site
        if: github.event_name != 'pull_request' && !github.event.repository.is_template
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && !github.event.repository.is_template
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
